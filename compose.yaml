name: cryptotools
services:
  app:
    image: ${CRYPTOTOOLS_IMAGE:-ghcr.io/stephanelepain-hub/cryptotools:latest}
    ports: ["127.0.0.1:${APP_PORT:-8080}:8080"]
    environment:
      PORT: "8080"
      DATA_FILE: /data/app.sqlite
      FEEDBACK_URL: ${FEEDBACK_URL:-http://feedback:8081/feedback}
      MASTER_SECRET_FILE: /data/master.secret
      SECURE_COOKIE: ${SECURE_COOKIE:-0}
      CRYPTOTOOLS_SANDBOX: ${CRYPTOTOOLS_SANDBOX:-0}
    volumes: ["app-data:/data"]
    depends_on:
      feedback:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8080/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 3s
      retries: 12
    restart: unless-stopped
    read_only: true
    tmpfs: ["/tmp"]
    cap_drop: ["ALL"]
    security_opt: ["no-new-privileges:true"]
  feedback:
    image: ${CRYPTOTOOLS_IMAGE:-ghcr.io/stephanelepain-hub/cryptotools:latest}
    command: ["node", "dist/feedback.js"]
    environment:
      PORT: "8081"
      DATA_FILE: /data/feedback.sqlite
    volumes: ["feedback-data:/data"]
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8081/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 3s
      retries: 12
    restart: unless-stopped
    read_only: true
    tmpfs: ["/tmp"]
    cap_drop: ["ALL"]
    security_opt: ["no-new-privileges:true"]
volumes:
  app-data:
  feedback-data:
